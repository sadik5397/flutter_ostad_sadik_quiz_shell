name: quiz_shell
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.12
  provider: ^6.1.5+1
  shimmer: ^3.0.0
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_markdown_plus: ^1.0.11

dev_dependencies:
  flutter_launcher_icons: "^0.14.4"
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "asset/app_logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "asset/app_logo.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - asset/
    - asset/category/
